name: Renovate clear arch overrides

permissions:
  contents: write

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".env"

jobs:
  clear-arch-overrides:
    if: github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Configure GIT for signed commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Comment out active arch override lines
        id: clear
        shell: bash
        run: |
          set -euo pipefail

          changed=false
          files=(.env.amd64 .env.arm64)

          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              continue
            fi

            if grep -Eq '^[[:space:]]*[^#[:space:]]' "$file"; then
              awk '{
                if ($0 ~ /^[[:space:]]*[^#[:space:]]/) {
                  print "# AUTO-DISABLED-BY-RENOVATE: " $0
                } else {
                  print $0
                }
              }' "$file" > "$file.tmp"
              mv "$file.tmp" "$file"
              echo "- Commented active override lines in \`$file\`" >> "$GITHUB_STEP_SUMMARY"
              changed=true
            fi
          done

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Commit and push override cleanup
        if: steps.clear.outputs.changed == 'true'
        shell: bash
        run: |
          git add .env.amd64 .env.arm64
          git commit -m "chore(ci): disable manual arch overrides for renovate update"
          git push origin "${{ github.head_ref }}"
      - name: No cleanup needed
        if: steps.clear.outputs.changed != 'true'
        run: echo "No active arch override lines found." >> "$GITHUB_STEP_SUMMARY"

